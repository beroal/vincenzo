[package]
name = "vcz_http_server"
version = "0.0.0"
edition = "2021"

[dependencies]
futures-util = "0.3.31"
pin-project = "1.0"
num = "0.4.3"
bytes = "1.10.1"
base64 = "0.22.1"
thiserror = "2.0.12"
tracing = "0.1.37"
tokio = { version = "1.32.0", features = ["tracing"] }
urlencoding = "2.1.3"
http = "1.3.1"
http-body = "1.0.1"
http-body-util = "0.1.3"
http-range-header = "0.4.2"
hyper = { version = "1.6.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.10", features = ["tokio", "server", "server-graceful", "server-auto"] }
vincenzo.workspace = true
